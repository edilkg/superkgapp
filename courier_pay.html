<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест фонового GPS</title>
    <style>
        body { font-family: sans-serif; padding: 10px; }
        #log { background: #f4f4f4; height: 400px; overflow-y: auto; padding: 10px; font-size: 14px; }
        .time { color: blue; font-weight: bold; }
    </style>
</head>
<body>
    <h2>Тест GPS в свернутом виде</h2>
    <p>Сверни Telegram на 2 минуты, потом вернись и посмотри на время записей.</p>
    <div id="log"></div>

    <script>
        const logDiv = document.getElementById('log');

        function addLog(message) {
            const now = new Date();
            const timeString = now.toLocaleTimeString();
            logDiv.innerHTML = `<span class="time">[${timeString}]</span> ${message}<br>` + logDiv.innerHTML;
        }

        // Проверяем, работает ли вообще JavaScript в фоне
        setInterval(() => {
            addLog("JS таймер тикает...");
        }, 5000);

        // Запрашиваем GPS
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(
                (position) => {
                    addLog(`GPS: Широта ${position.coords.latitude.toFixed(5)}, Долгота ${position.coords.longitude.toFixed(5)}`);
                },
                (error) => {
                    addLog(`Ошибка GPS: ${error.message}`);
                },
                { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
            );
        } else {
            addLog("Геолокация не поддерживается");
        }
    </script>
</body>
</html>
