<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Пополнение баланса</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: var(--tg-theme-bg-color, #1c1c1e);
            color: var(--tg-theme-text-color, #ffffff);
            margin: 0; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center;
            
            /* Делаем высоту на весь экран */
            min-height: 100vh;
            box-sizing: border-box;
            
            /* Выравниваем по центру, но приподнимаем чуть выше середины */
            justify-content: center; 
            padding-bottom: 15vh; 
        }
        .container {
            width: 100%; 
            max-width: 400px;
            background: var(--tg-theme-secondary-bg-color, #2c2c2e);
            border-radius: 16px; 
            padding: 24px; 
            box-sizing: border-box;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15); 
        }
        h2 { margin-top: 0; text-align: center; font-size: 20px; }
        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #888; font-size: 14px; }
        
        /* Обертка для поля и крестика */
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        
        input {
            width: 100%; 
            padding: 16px 45px 16px 16px; /* Оставляем место справа для крестика */
            border-radius: 12px; 
            border: 1px solid #444;
            background: var(--tg-theme-bg-color, #1c1c1e); 
            color: var(--tg-theme-text-color, #fff);
            font-size: 24px; 
            font-weight: bold; 
            text-align: left; 
            outline: none; 
            box-sizing: border-box;
        }
        input:focus { border-color: #007aff; }

        /* Красивый крестик внутри поля */
        .clear-icon {
            position: absolute;
            right: 12px;
            width: 26px;
            height: 26px;
            background: #555;
            color: #fff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            padding: 0;
            line-height: 1;
        }
        .clear-icon:active {
            background: #777;
        }
        
        .quick-amounts {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 20px;
        }
        .quick-btn {
            flex: 1;
            padding: 12px 0;
            border-radius: 10px;
            border: 1px solid #444;
            background: var(--tg-theme-bg-color, #1c1c1e);
            color: var(--tg-theme-text-color, #fff);
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .quick-btn:active {
            background: var(--tg-theme-button-color, #007aff);
            color: var(--tg-theme-button-text-color, #fff);
            border-color: var(--tg-theme-button-color, #007aff);
        }

        .pay-btn {
            width: 100%; 
            padding: 16px; 
            border-radius: 12px; 
            border: none;
            background: var(--tg-theme-button-color, #007aff);
            color: var(--tg-theme-button-text-color, #fff);
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: 0.2s;
        }
        .info { font-size: 13px; color: #888; text-align: center; margin-top: 15px; }
    </style>
</head>
<body>
<div id="maintenance-overlay" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: var(--tg-theme-bg-color, #ffffff); z-index: 999999; display: block; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box;">
    
    <div style="font-size: 72px; margin-bottom: 16px;">🛠️</div>
    
    <h1 style="color: var(--tg-theme-text-color, #222222); font-size: 26px; font-weight: 800; margin-bottom: 12px; font-family: system-ui, -apple-system, sans-serif;">
        Техническое обновление
    </h1>
    
    <p style="color: var(--tg-theme-hint-color, #777777); font-size: 16px; line-height: 1.5; font-family: system-ui, -apple-system, sans-serif; max-width: 320px; margin: 0;">
        Прямо сейчас мы прокачиваем <b>TamakKG</b>, чтобы сделать доставку ещё быстрее и удобнее! 🚀<br><br>
        Сервис скоро будет готов к работе <br>
    </p>
    
</div>
<div class="container">
    <h2>💳 Пополнение баланса</h2>
    <div class="input-group">
        <label>Введите сумму (сом):</label>
        <div class="input-wrapper">
            <input type="number" id="amount-input" placeholder="0" inputmode="numeric">
            <!-- Крестик внутри поля -->
            <button class="clear-icon" onclick="clearAmount()">×</button>
        </div>
    </div>
    
    <div class="quick-amounts">
        <button class="quick-btn" onclick="addAmount(50)">+50</button>
        <button class="quick-btn" onclick="addAmount(200)">+200</button>
        <button class="quick-btn" onclick="addAmount(400)">+400</button>
    </div>

    <button class="pay-btn" id="pay-btn" onclick="generateAndPay()">Перейти к оплате</button>
    <div class="info">Ваш системный ID: <strong id="courier-id">...</strong></div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const urlParams = new URLSearchParams(window.location.search);
    const urlId = urlParams.get('id');
    const courierId = urlId || tg.initDataUnsafe?.user?.id || 'Неизвестно';
    document.getElementById('courier-id').innerText = courierId;

    function addAmount(val) {
        const input = document.getElementById('amount-input');
        let currentAmount = parseInt(input.value) || 0; 
        input.value = currentAmount + val;
        
        if (tg.HapticFeedback) {
            tg.HapticFeedback.impactOccurred('light');
        }
    }

    // Очистка строки по клику на крестик
    function clearAmount() {
        document.getElementById('amount-input').value = '';
        if (tg.HapticFeedback) {
            tg.HapticFeedback.impactOccurred('rigid');
        }
    }

    async function generateAndPay() {
        const amount = document.getElementById('amount-input').value;
        if (!amount || amount < 10) {
            tg.showAlert("Пожалуйста, введите сумму больше 10 сом.");
            return;
        }

        if (courierId === 'Неизвестно') {
            tg.showAlert("Ошибка: Ваш ID не распознан. Нажмите /start в боте и попробуйте снова.");
            return;
        }

        const btn = document.getElementById('pay-btn');
        btn.innerText = "⏳ Создаем защищенную ссылку...";
        btn.style.opacity = "0.7";
        btn.style.pointerEvents = "none";
        if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

        try {
            const response = await fetch('https://tamak-backend.onrender.com/api/generate-courier-paylink', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ courierId, amount })
            });

            const data = await response.json();

            if (data.url) {
                tg.openLink(data.url);
                tg.close();
            } else {
                tg.showAlert("Ошибка со стороны банка: " + (data.error || "Неизвестная ошибка"));
            }
        } catch (e) {
            tg.showAlert("Ошибка сети. Проверьте интернет.");
        } finally {
            btn.innerText = "Перейти к оплате";
            btn.style.opacity = "1";
            btn.style.pointerEvents = "auto";
        }
    }
</script>
</body>
</html>
